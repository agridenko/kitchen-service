{% extends 'base.html' %}

{% block content %}
  <h1>Delete Cook</h1>
  <p>Are you sure you want to delete the cook <strong>"{{ object }}"</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Yes, delete</button>
    <a class="btn btn-secondary" href="{% url 'kitchen:cook_list' %}">Cancel</a>
  </form>
{% endblock %}
